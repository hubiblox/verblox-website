<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>
    <!-- Link element that displays logo.png next to your text in the browser page bar -->
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        /* Define custom font properly using @font-face if you have a font file */
        @font-face {
            font-family: 'GothamSSm';
            src: url('gotham.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'GothamSSm', 'Montserrat', Arial, sans-serif;
            overflow: hidden;
            background-color: #000000;
        }

        /* 2.png background configuration */
        .maintenance-container {
            height: 100%;
            width: 100%;
            background: url('2.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Content block pushed down slightly to lower the entire text and logo block */
        .content-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            width: 100%;
            padding: 20px;
            margin-top: 80px; /* Pushes the entire block down away from the very top */
        }

        /* SORRY TEXT: Clean geometric spacing positioned above the logo */
        .maintenance-text {
            font-size: clamp(1.5rem, 3.5vw, 2.8rem);
            font-weight: normal;
            line-height: 1.3;
            letter-spacing: -0.5px;
            margin-bottom: 50px; /* Increased spacing between text and logo */
            text-shadow: 0px 4px 12px rgba(0, 0, 0, 0.6);
        }

        .maintenance-text span {
            display: block;
        }

        /* LOGO: Sized image asset resting directly below the text block */
        .logo-container img {
            width: 100%;
            max-width: 720px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 6px 15px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="content-box">
            <!-- SORRY TEXT SITS ON TOP -->
            <h1 class="maintenance-text">
                <span>We’re making things better for you.</span>
                <span>Be back near 27th Dec.</span>
            </h1>
            <!-- LOGO SITS UNDERNEATH -->
            <div class="logo-container">
                <img src="1.png" alt="Verblox Logo">
            </div>
        </div>
    </div>
</body>
</html>
